<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EDF3F0;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;padding:20px}
  .card{background:#fff;border-top:5px solid #00AB5F;border-radius:14px;
    box-shadow:0 6px 30px rgba(0,90,55,.08);padding:44px 40px;width:100%;max-width:400px;text-align:center}

    font-family:inherit;outline:none;transition:border-color .2s;text-align:center}
  input:focus{border-color:#00AB5F}
  button{width:100%;margin-top:12px;background:#00AB5F;color:#fff;border:none;border-radius:9px;
    padding:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  button:hover{background:#007A44}
  button:disabled{background:#9AD9BC;cursor:default}
  .err{color:#C0392B;font-size:13px;margin-top:12px;min-height:18px}
  .note{margin-top:22px;font-size:12px;color:#9AAFA5;letter-spacing:1px}
  #doc{position:fixed;inset:0;width:100%;height:100%;border:none;display:none;background:#fff}

pwEl.addEventListener('input',function(){errEl.textContent='';});

async function unlock(){
  var pw=pwEl.value;
